<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#190e20">
  <title>Mystery Sweet Casino</title>
  <style>
    :root {
      color-scheme: dark;
      overscroll-behavior-y: none;
      font-family: system-ui, sans-serif;
      background: #190e20;
      color: #fff6eb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background: #190e20;
      isolation: isolate;
    }
    .fondo-ruleta {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(ellipse at center bottom, #301625, #190e20 72%);
    }
    .fondo-ruleta::before, .fondo-ruleta::after {
      content: '';
      position: absolute;
      inset: 0;
    }
    .fondo-ruleta::before {
      inset: -8px;
      background: url("gato-pastelero.webp") center bottom / clamp(340px, 100vw, 550px) auto no-repeat;
      transform-origin: center bottom;
    }
    .fondo-ruleta::after {
      background: linear-gradient(180deg, #160c20a6, #160c2030 64%, #160c2010);
    }
    @media (prefers-reduced-motion: no-preference) {
      .fondo-ruleta::before { animation: gato-ruleta 6s ease-in-out infinite alternate; }
    }
    @keyframes gato-ruleta {
      from { transform: scale(1); }
      to { transform: translateY(-4px) scale(1.025); }
    }
    main {
      width: 100%;
      max-width: 560px;
      display: grid;
      justify-items: center;
      gap: clamp(17px, 4vw, 28px);
      margin: 0 auto;
      padding: 52px 16px 32px;
      padding: max(52px, calc(env(safe-area-inset-top) + 34px)) 16px max(29px, env(safe-area-inset-bottom));
      text-align: center;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.32rem, 5.7vw, 2rem);
      line-height: 1.18;
      margin: 0;
      max-width: 24ch;
      text-shadow: 0 2px 10px #100813;
    }
    .marca { display: flex; align-items: center; justify-content: center; gap: .55rem; color: #ffe0a2; font: bold clamp(1rem, 4.5vw, 1.45rem) Georgia, serif; }
    .marca img { display: block; width: 52px; height: 52px; }
    .indicacion p { margin: .4rem 0 0; color: #ffe0a2; font-weight: 700; }
    .marco {
      position: relative;
      width: 80vw;
      height: 80vw;
      max-width: 360px;
      max-height: 360px;
      border: 6px solid #f7cf79;
      border-radius: 50%;
      padding: 4px;
      background: #301425;
      box-shadow: 0 0 0 2px #fff0c3, 0 12px 30px #0e0714b8;
    }
    .rueda {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background-color: #47334f;
      background-image: conic-gradient(from -22.5deg, #a03660 0deg 45deg, #474059 45deg 90deg, #1f665f 90deg 135deg, #3c415b 135deg 180deg, #84521c 180deg 225deg, #474059 225deg 270deg, #3c415b 270deg 315deg, #514154 315deg 360deg);
      transition: transform var(--duracion-giro) cubic-bezier(.15,.65,.14,1);
      border: 1px solid #ffebaa;
    }
    .rueda::after {
      content: '';
      position: absolute;
      inset: 41%;
      border: 3px solid #ffe6a1;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 30%, #ffe9a3, #b86a35 70%, #623328 100%);
      box-shadow: 0 2px 8px #20101098;
    }
    .marcador {
      position: absolute;
      z-index: 1;
      top: -12px;
      left: 50%;
      width: 30px;
      height: 37px;
      transform: translateX(-50%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: #fff1bb;
    }
    .etiqueta {
      position: absolute;
      color: #fff9ed;
      width: 24%;
      font-size: clamp(.75rem, 3.3vw, 1.05rem);
      font-weight: 800;
      line-height: 1.09;
      transform: translate(-50%, -50%) rotate(var(--contragiro, 0deg));
      transition: transform var(--duracion-giro) cubic-bezier(.15,.65,.14,1);
      text-shadow: 0 2px 4px #180a14c4;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #girar {
      width: 74vw;
      max-width: 255px;
      min-height: 55px;
      border: 2px solid #ffe6a1;
      border-radius: 38px;
      background: linear-gradient(180deg, #ffe6a1, #f6ad65);
      color: #341522;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .1em;
      box-shadow: 0 4px 0 #a34f39, 0 10px 24px #170c19b0;
    }
    #girar:disabled { cursor: default; opacity: .82; }
    #estado-giro:empty { display: none; }
    #estado-giro:not(:empty) { margin: 0; padding: .45rem .65rem; border-radius: 9px; background: #24132bee; color: #ffe0a2; font-weight: 700; }
    #ajustes {
      position: fixed;
      z-index: 2;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      width: 45px;
      height: 45px;
      border: 1px solid #ffe0a9;
      border-radius: 50%;
      background: #24132be8;
      color: white;
      padding: 0;
      font-size: 1.15rem;
    }
    .menu-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: .55rem 1.3rem;
      border: 1px solid #e7bd7e;
      border-radius: 24px;
      background: #24132bee;
      color: #fff0ce;
      text-decoration: none;
      font-weight: 750;
    }
    body.ventana-abierta { overflow: hidden; }
    #ventana[open].compatible {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      background: #100916b3;
      padding: 20px;
    }
    #ventana.compatible .tarjeta { width: min(100%, 410px); }

    @media (prefers-reduced-motion: reduce) {
      .rueda { transition: none; }
    }
      .uno { top: 17%; left: 50%; }
    .dos { top: 26.7%; left: 73.3%; }
    .tres { top: 50%; left: 83%; }
    .cuatro { top: 73.3%; left: 73.3%; }
    .cinco { top: 83%; left: 50%; }
    .seis { top: 73.3%; left: 26.7%; }
    .siete { top: 50%; left: 17%; }
    .ocho { top: 26.7%; left: 26.7%; }
    #ventana {
      width: min(88vw, 410px);
      margin: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      overflow: visible;
      text-align: center;
    }
    #ventana:not([open]) { display: none; }
    #ventana::backdrop { background: #100916b3; }
    .tarjeta {
      position: relative;
      z-index: 1;
      border: 2px solid #f6cf82;
      border-radius: 28px;
      padding: 27px 19px;
      background: #2b182f;
      box-shadow: 0 16px 45px #09040dc7;
    }
    #titulo-resultado {
      margin: 0 0 8px;
      font: bold clamp(1.65rem, 7vw, 2.35rem) Georgia, serif;
      color: #ffdda0;
    }
    #resultado { margin: 0 0 22px; font-size: 1.2rem; font-weight: 750; }
    #cerrar {
      min-height: 44px;
      padding: 0 24px;
      border: 1px solid #ffdfa6;
      border-radius: 28px;
      background: #f9cf8d;
      color: #321c2c;
      font-weight: 800;
    }
    #efectos { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .particula {
      position: absolute;
      top: -3rem;
      left: var(--x);
      animation: caer var(--duracion) linear var(--demora) both;
    }
    .confeti { width: 9px; height: 14px; background: var(--color); border-radius: 2px; }
    .rosa { font-size: var(--tamano); --brillo: .43; }
    @keyframes caer {
      0% { transform: translate3d(0, -4vh, 0) rotate(0); opacity: 0; }
      12% { opacity: var(--brillo, 1); }
      85% { opacity: var(--brillo, 1); }
      100% { transform: translate3d(var(--desvio), 113vh, 0) rotate(var(--giro)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .etiqueta { transition: none; }
    }
  </style>
  <link rel="stylesheet" href="ajustes.css">
</head>
<body>
  <div class="fondo-ruleta" aria-hidden="true"></div>
  <main>
    <div class="marca">
      <img src="logo-msc-v2.webp" width="52" height="52" alt="">
      <span>Mystery Sweet Casino</span>
    </div>
    <div class="indicacion">
      <h1 id="instruccion" tabindex="-1">Girá la ruleta con un empleado del puesto cerca</h1>
      <p>Todos pueden girar.</p>
    </div>
    <div class="marco" role="img" aria-label="Ruleta con ocho casillas: cinco sin premio, un paquete de Mini Oreo, un paquete de Oreo clásicas y un mini trozo de tarta">
      <span class="marcador" aria-hidden="true"></span>
      <div class="rueda" id="rueda" aria-hidden="true">
        <span class="etiqueta uno">Mini<br>Oreo</span>
        <span class="etiqueta dos">Sin<br>premio</span>
        <span class="etiqueta tres">Oreo<br>clásicas</span>
        <span class="etiqueta cuatro">Sin<br>premio</span>
        <span class="etiqueta cinco">Mini trozo<br>de tarta</span>
        <span class="etiqueta seis">Sin<br>premio</span>
        <span class="etiqueta siete">Sin<br>premio</span>
        <span class="etiqueta ocho">Sin<br>premio</span>
      </div>
    </div>
    <button id="girar" type="button">GIRAR</button>
    <p id="estado-giro" role="status"></p>
    <a class="menu-link" href="menu.html">Ver menú</a>
  </main>
  <dialog id="ventana" role="dialog" aria-modal="true" aria-labelledby="titulo-resultado" aria-describedby="resultado">
    <div id="efectos" aria-hidden="true"></div>
    <div class="tarjeta">
      <h2 id="titulo-resultado"></h2>
      <p id="resultado"></p>
      <button id="cerrar" type="button" autofocus>Cerrar</button>
    </div>
  </dialog>
  <button id="ajustes" type="button" aria-label="Ajustes" aria-haspopup="dialog">⚙️</button>
  <audio id="musica" src="musica.mp3" loop preload="none"></audio>
  <script src="musica.js?v=3"></script>
  <script>
    const premios = ['Ganaste un paquete de Mini Oreo', null, 'Ganaste un paquete de Oreo clásicas', null, 'Ganaste un mini trozo de tarta', null, null, null];
    const mensajesSinPremio = {
      1: [
        '¡Uyy, che! Justito entre los dos paquetes de Oreo.',
        'Nde, ¡el Oreo pasó cerquita y ni saludó!'
      ],
      3: [
        'La tarta y el Oreo te hicieron el pasillito. ¡Por un pelito!',
        '¡Qué macana! La tarta estaba ahí nomás.'
      ],
      5: [
        'La tarta quedó ahí nomás. ¡Hasta se sentía el olorcito!',
        '¡Epa! La tarta se hizo la difícil y se quedó al ladito.'
      ],
      6: [
        'La ruleta se fue de paseo lejos de los premios. ¡Te mandó saludos!',
        'Che, la flecha se tomó el colectivo equivocado.'
      ],
      7: ['Las Mini Oreo se hicieron las distraídas en la casilla de al lado.']
    };
    const urlGiro = "https://eyvzpzwagdccphsktogu.supabase.co/rest/v1/rpc/mystery_sweet_girar";
    const clavePublica = "sb_publishable_TuwjOiBnavNXWkxzGye_Jw_20vuNP8E";
    const claveGiroPendiente = "mystery-sweet-giro-pendiente";
    const duracionGiro = 7000;
    const paleta = ['#ffcc74', '#ff83aa', '#76e5bf', '#d49cff', '#fff0be'];
    const elemento = id => document.getElementById(id);
    const girar = elemento('girar');
    const rueda = elemento('rueda');
    const ventana = elemento('ventana');
    const efectos = elemento('efectos');
    const reducirMovimiento = matchMedia('(prefers-reduced-motion: reduce)');
    const estadoGiro = elemento("estado-giro");
    let giroIniciado = false;
    let idGiro;

    function indiceAlAzar(cantidad) {
      if (!window.crypto || typeof window.crypto.getRandomValues !== 'function') {
        return Math.floor(Math.random() * cantidad);
      }
      const rango = 2 ** 32;
      const limite = rango - rango % cantidad;
      const bytes = new Uint32Array(1);
      do {
        window.crypto.getRandomValues(bytes);
      } while (bytes[0] >= limite);
      return bytes[0] % cantidad;
    }

    function obtenerIdGiro() {
      if (idGiro) return idGiro;
      try {
        idGiro = sessionStorage.getItem(claveGiroPendiente);
      } catch (_) {}
      if (!idGiro) {
        idGiro = crypto.randomUUID();
        try {
          sessionStorage.setItem(claveGiroPendiente, idGiro);
        } catch (_) {}
      }
      return idGiro;
    }

    async function pedirCasilla() {
      const controlador = new AbortController();
      const limite = setTimeout(() => controlador.abort(), 10000);
      try {
        const respuesta = await fetch(urlGiro, {
          method: 'POST',
          headers: { apikey: clavePublica, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_id: obtenerIdGiro() }),
          signal: controlador.signal
        });
        if (!respuesta.ok) throw new Error('No se confirmó el giro');
        const casilla = await respuesta.json();
        if (!Number.isInteger(casilla) || casilla < 0 || casilla >= premios.length) {
          throw new Error('Respuesta de giro inválida');
        }
        return casilla;
      } finally {
        clearTimeout(limite);
      }
    }

    function animarResultado(gano) {
      if (reducirMovimiento.matches) return;
      const cantidad = gano ? 52 : 14;
      const particulas = document.createDocumentFragment();
      for (let i = 0; i < cantidad; i++) {
        const particula = document.createElement('span');
        particula.className = gano ? 'particula confeti' : 'particula rosa';
        if (!gano) particula.textContent = '🥀';
        particula.style.setProperty('--x', (2 + Math.random() * 94) + 'vw');
        particula.style.setProperty('--desvio', (Math.random() * 30 - 15) + 'vw');
        particula.style.setProperty('--giro', (Math.random() * 520 - 260) + 'deg');
        particula.style.setProperty('--demora', Math.random() * 1.2 + 's');
        particula.style.setProperty('--duracion', (2.3 + Math.random() * 1.4) + 's');
        particula.style.setProperty('--color', paleta[i % paleta.length]);
        particula.style.setProperty('--tamano', (1.3 + Math.random() * 1.4) + 'rem');
        particula.addEventListener('animationend', () => particula.remove(), { once: true });
        particulas.append(particula);
      }
      efectos.append(particulas);
    }

    function limpiarResultado() {
      efectos.textContent = '';
      document.body.classList.remove('ventana-abierta');
      elemento('instruccion').focus();
    }

    function abrirResultado() {
      if (typeof ventana.showModal === 'function') {
        ventana.showModal();
      } else {
        ventana.classList.add('compatible');
        ventana.setAttribute('open', '');
        document.body.classList.add('ventana-abierta');
        elemento('cerrar').focus();
      }
    }

    elemento('cerrar').addEventListener('click', () => {
      if (typeof ventana.close === 'function') {
        ventana.close();
      } else {
        ventana.removeAttribute('open');
        limpiarResultado();
      }
    });
    ventana.addEventListener('close', limpiarResultado);

    girar.addEventListener('click', async () => {
      if (giroIniciado) return;
      giroIniciado = true;
      girar.disabled = true;
      audioDelPuesto.iniciar();

      girar.textContent = 'CONECTANDO…';
      estadoGiro.textContent = '';
      let indice;
      try {
        indice = await pedirCasilla();
      } catch (_) {
        giroIniciado = false;
        girar.disabled = false;
        girar.textContent = 'REINTENTAR';
        estadoGiro.textContent = 'No pudimos confirmar el giro. Revisá la conexión y volvé a intentar.';
        return;
      }
      const premio = premios[indice];
      const angulo = 360 * 9 - indice * (360 / premios.length);
      rueda.style.setProperty('--duracion-giro', duracionGiro + 'ms');
      rueda.style.setProperty('--contragiro', -angulo + 'deg');
      rueda.style.transform = 'rotate(' + angulo + 'deg)';
      girar.textContent = 'GIRANDO…';

      let revelado = false;
      function revelar() {
        if (revelado) return;
        revelado = true;
        elemento('titulo-resultado').textContent = premio ? '¡Felicitaciones!' : '¡La próxima seguro sale!';
        const mensajes = mensajesSinPremio[indice];
        elemento('resultado').textContent = premio || mensajes[indiceAlAzar(mensajes.length)];
        girar.textContent = 'GIRO REALIZADO';
        try {
          sessionStorage.removeItem(claveGiroPendiente);
        } catch (_) {}
        abrirResultado();
        animarResultado(Boolean(premio));
      }

      if (reducirMovimiento.matches) revelar();
      else {
        rueda.addEventListener('transitionend', evento => {
          if (evento.target === rueda && evento.propertyName === 'transform') revelar();
        });
        setTimeout(revelar, duracionGiro + 250);
      }
    });
  </script>
</body>
</html>
