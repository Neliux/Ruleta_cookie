<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#190e20">
  <title>Mystery Sweet Casino</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #190e20;
      color: #fff6eb;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      background-color: #190e20;
      background-image: linear-gradient(180deg, #160c20b3 0%, #160c2030 64%, #160c2010 100%), url("gato-pastelero.webp");
      background-position: center, right bottom;
      background-repeat: no-repeat;
      background-size: cover, auto 100%;
    }
    main {
      width: min(100%, 560px);
      display: grid;
      justify-items: center;
      gap: clamp(17px, 4vw, 28px);
      margin: 0 auto;
      padding: max(52px, calc(env(safe-area-inset-top) + 34px)) 16px max(29px, env(safe-area-inset-bottom));
      text-align: center;
    }
    h1 {
      font-family: Georgia, serif;
      font-size: clamp(1.32rem, 5.7vw, 2rem);
      line-height: 1.18;
      margin: 0;
      max-width: 24ch;
      text-shadow: 0 2px 10px #100813;
    }
    .marco {
      position: relative;
      width: min(83vw, 360px);
      aspect-ratio: 1;
      border: 6px solid #f7cf79;
      border-radius: 50%;
      padding: 4px;
      background: #301425;
      box-shadow: 0 0 0 2px #fff0c3, 0 12px 30px #0e0714b8;
    }
    .rueda {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      background: conic-gradient(from -36deg, #a03660 0deg 72deg, #474059 72deg 144deg, #1f665f 144deg 216deg, #3c415b 216deg 288deg, #84521c 288deg 360deg);
      transition: transform 4.1s cubic-bezier(.13,.71,.15,1);
      border: 1px solid #ffebaa;
    }
    .rueda::after {
      content: '';
      position: absolute;
      inset: 41%;
      border: 3px solid #ffe6a1;
      border-radius: 50%;
      background: radial-gradient(circle at 36% 30%, #ffe9a3, #b86a35 70%, #623328 100%);
      box-shadow: 0 2px 8px #20101098;
    }
    .marcador {
      position: absolute;
      z-index: 1;
      top: -12px;
      left: 50%;
      width: 30px;
      height: 37px;
      transform: translateX(-50%);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      background: #fff1bb;
    }
    .etiqueta {
      position: absolute;
      color: #fff9ed;
      width: 30%;
      font-size: clamp(.9rem, 4vw, 1.25rem);
      font-weight: 800;
      line-height: 1.09;
      transform: translate(-50%, -50%) rotate(var(--contragiro, 0deg));
      transition: transform 4.1s cubic-bezier(.13,.71,.15,1);
      text-shadow: 0 2px 4px #180a14c4;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #girar {
      min-width: min(74vw, 255px);
      min-height: 55px;
      border: 2px solid #ffe6a1;
      border-radius: 38px;
      background: linear-gradient(180deg, #ffe6a1, #f6ad65);
      color: #341522;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: .1em;
      box-shadow: 0 4px 0 #a34f39, 0 10px 24px #170c19b0;
    }
    #girar:disabled { cursor: default; opacity: .82; }
    #sonido {
      position: fixed;
      z-index: 2;
      top: max(8px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      width: 45px;
      height: 45px;
      border: 1px solid #ffe0a9;
      border-radius: 50%;
      background: #24132be8;
      color: white;
      padding: 0;
      font-size: 1.15rem;
    }
    @media (min-width: 750px) {
      body { background-size: cover, auto max(100%, 620px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rueda { transition: none; }
    }
      .uno { top: 19%; left: 50%; }
    .dos { top: 40%; left: 80%; }
    .tres { top: 76%; left: 69%; }
    .cuatro { top: 76%; left: 31%; }
    .cinco { top: 40%; left: 20%; }
    #ventana {
      width: min(88vw, 410px);
      margin: auto;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      overflow: visible;
      text-align: center;
    }
    #ventana::backdrop { background: #100916b3; }
    .tarjeta {
      position: relative;
      z-index: 1;
      border: 2px solid #f6cf82;
      border-radius: 28px;
      padding: 27px 19px;
      background: #2b182f;
      box-shadow: 0 16px 45px #09040dc7;
    }
    #titulo-resultado {
      margin: 0 0 8px;
      font: bold clamp(1.65rem, 7vw, 2.35rem) Georgia, serif;
      color: #ffdda0;
    }
    #resultado { margin: 0 0 22px; font-size: 1.2rem; font-weight: 750; }
    #cerrar {
      min-height: 44px;
      padding: 0 24px;
      border: 1px solid #ffdfa6;
      border-radius: 28px;
      background: #f9cf8d;
      color: #321c2c;
      font-weight: 800;
    }
    #efectos { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .particula {
      position: absolute;
      top: -3rem;
      left: var(--x);
      animation: caer var(--duracion) linear var(--demora) both;
    }
    .confeti { width: 9px; height: 14px; background: var(--color); border-radius: 2px; }
    .rosa { font-size: var(--tamano); --brillo: .43; }
    @keyframes caer {
      0% { transform: translate3d(0, -4vh, 0) rotate(0); opacity: 0; }
      12% { opacity: var(--brillo, 1); }
      85% { opacity: var(--brillo, 1); }
      100% { transform: translate3d(var(--desvio), 113vh, 0) rotate(var(--giro)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .etiqueta { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Girá la ruleta con un empleado del puesto cerca</h1>
    <div class="marco" role="img" aria-label="Ruleta con cinco casillas: minigalletas, dos casillas sin premio, un Oreo gratis y un mini trozo de tarta">
      <span class="marcador" aria-hidden="true"></span>
      <div class="rueda" id="rueda" aria-hidden="true">
        <span class="etiqueta uno">Mini&shy;galletas</span>
        <span class="etiqueta dos">Sin<br>premio</span>
        <span class="etiqueta tres">Oreo<br>gratis</span>
        <span class="etiqueta cuatro">Sin<br>premio</span>
        <span class="etiqueta cinco">Mini trozo<br>de tarta</span>
      </div>
    </div>
    <button id="girar" type="button">GIRAR</button>
  </main>
  <dialog id="ventana" aria-labelledby="titulo-resultado" aria-describedby="resultado">
    <div id="efectos" aria-hidden="true"></div>
    <div class="tarjeta">
      <h2 id="titulo-resultado"></h2>
      <p id="resultado"></p>
      <form method="dialog"><button id="cerrar" type="submit" autofocus>Cerrar</button></form>
    </div>
  </dialog>
  <button id="sonido" type="button" title="Silenciar música" aria-label="Música" aria-pressed="true">🔊</button>
  <audio id="musica" src="musica.mp3" loop preload="none"></audio>
  <script>
    const premios = ['Ganaste minigalletas', null, 'Ganaste un Oreo gratis', null, 'Ganaste un mini trozo de tarta'];
    const paleta = ['#ffcc74', '#ff83aa', '#76e5bf', '#d49cff', '#fff0be'];
    const elemento = id => document.getElementById(id);
    const girar = elemento('girar');
    const rueda = elemento('rueda');
    const ventana = elemento('ventana');
    const efectos = elemento('efectos');
    const sonido = elemento('sonido');
    const musica = elemento('musica');
    const reducirMovimiento = matchMedia('(prefers-reduced-motion: reduce)');
    let sonidoActivo = true;
    let giroIniciado = false;

    function indiceAlAzar(cantidad) {
      const rango = 2 ** 32;
      const limite = rango - rango % cantidad;
      const bytes = new Uint32Array(1);
      do {
        crypto.getRandomValues(bytes);
      } while (bytes[0] >= limite);
      return bytes[0] % cantidad;
    }

    function iniciarMusica() {
      if (sonidoActivo) musica.play().catch(() => {});
    }

    function animarResultado(gano) {
      if (reducirMovimiento.matches) return;
      const cantidad = gano ? 52 : 14;
      const particulas = document.createDocumentFragment();
      for (let i = 0; i < cantidad; i++) {
        const particula = document.createElement('span');
        particula.className = gano ? 'particula confeti' : 'particula rosa';
        if (!gano) particula.textContent = '🥀';
        particula.style.setProperty('--x', (2 + Math.random() * 94) + 'vw');
        particula.style.setProperty('--desvio', (Math.random() * 30 - 15) + 'vw');
        particula.style.setProperty('--giro', (Math.random() * 520 - 260) + 'deg');
        particula.style.setProperty('--demora', Math.random() * 1.2 + 's');
        particula.style.setProperty('--duracion', (2.3 + Math.random() * 1.4) + 's');
        particula.style.setProperty('--color', paleta[i % paleta.length]);
        particula.style.setProperty('--tamano', (1.3 + Math.random() * 1.4) + 'rem');
        particula.addEventListener('animationend', () => particula.remove(), { once: true });
        particulas.append(particula);
      }
      efectos.append(particulas);
    }

    sonido.addEventListener('click', () => {
      sonidoActivo = !sonidoActivo;
      sonido.textContent = sonidoActivo ? '🔊' : '🔇';
      sonido.setAttribute('aria-pressed', String(sonidoActivo));
      sonido.title = sonidoActivo ? 'Silenciar música' : 'Activar música';
      if (sonidoActivo) iniciarMusica();
      else musica.pause();
    });

    ventana.addEventListener('close', () => efectos.replaceChildren());

    girar.addEventListener('click', () => {
      if (giroIniciado) return;
      giroIniciado = true;
      girar.disabled = true;
      iniciarMusica();

      const indice = indiceAlAzar(premios.length);
      const premio = premios[indice];
      const angulo = 360 * 6 - indice * (360 / premios.length);
      rueda.style.setProperty('--contragiro', -angulo + 'deg');
      rueda.style.transform = 'rotate(' + angulo + 'deg)';
      girar.textContent = 'GIRANDO…';

      let revelado = false;
      function revelar() {
        if (revelado) return;
        revelado = true;
        elemento('titulo-resultado').textContent = premio ? '¡Felicitaciones!' : '¡Para la próxima seguro sale!';
        elemento('resultado').textContent = premio || 'Esta vez, sin premio';
        girar.textContent = 'GIRO REALIZADO';
        ventana.showModal();
        animarResultado(Boolean(premio));
      }

      if (reducirMovimiento.matches) revelar();
      else {
        rueda.addEventListener('transitionend', evento => {
          if (evento.target === rueda && evento.propertyName === 'transform') revelar();
        });
        setTimeout(revelar, 4350);
      }
    });
  </script>
</body>
</html>
