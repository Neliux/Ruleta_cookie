<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#190e20">
  <title>Menú | Mystery Sweet Casino</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #190e20; color: #fff5e2; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at top, #422239, #190e20 55%); }
    main { width: 100%; max-width: 620px; margin: auto; padding: 22px 18px 36px; }
    nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    nav a, nav button { color: #ffe0a2; background: #24132b; display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: .35rem .8rem; border: 1px solid #be9561; border-radius: 24px; text-decoration: none; font: inherit; font-weight: 700; }
    nav button { min-width: 44px; cursor: pointer; }
    a:focus-visible, button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    h1 { font: bold clamp(2rem, 8vw, 3.2rem) Georgia, serif; text-align: center; margin: 22px 0; }
    .carta { margin: 0; padding: 0; list-style: none; border: 1px solid #b38c63; border-radius: 20px; background: #2b182f; }
    li { padding: 1.15rem 1.25rem; }
    li + li { border-top: 1px solid #b38c635e; }
    h2 { font: bold clamp(1.17rem, 4.8vw, 1.6rem) Georgia, serif; color: #ffe0a2; margin: 0 0 .35rem; }
    p { margin: 0; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Menú">
      <a href="index.html">Volver a la ruleta</a>
      <button id="sonido" type="button" aria-label="Activar música" aria-pressed="false">🔇</button>
    </nav>
    <h1>Menú</h1>
    <ul class="carta">
      <li>
        <h2>Negra maluca</h2>
        <p>Torta húmeda de chocolate con cobertura de chocolate.</p>
      </li>
      <li>
        <h2>Tarta de gelatina de uva</h2>
        <p>Tarta fresca con gelatina de uva y base crocante.</p>
      </li>
      <li>
        <h2>Galletitas con chispa de chocolate</h2>
        <p>Galletitas doradas con trocitos de chocolate.</p>
      </li>
    </ul>
  </main>
  <audio id="musica" src="musica.mp3" loop preload="none"></audio>
  <script src="musica.js"></script>
  <script>
    window.addEventListener('pageshow', audioDelPuesto.iniciar);
  </script>
</body>
</html>
