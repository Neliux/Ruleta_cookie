<!doctype html>
<html lang="es-PY">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#190e20">
  <title>Menú | Mystery Sweet Casino</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #190e20; color: #fff5e2; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(ellipse at top, #422239, #190e20 55%); }
    main { width: 100%; max-width: 620px; margin: auto; padding: 22px 18px 36px; }
    a { color: #ffe0a2; display: inline-flex; align-items: center; min-height: 44px; padding: .35rem .8rem; border: 1px solid #be9561; border-radius: 24px; text-decoration: none; font-weight: 700; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    h1 { font: bold clamp(2rem, 8vw, 3.2rem) Georgia, serif; text-align: center; margin: 10px 0 22px; }
    .carta { position: relative; overflow: hidden; border: 1px solid #b38c63; border-radius: 20px; background: #3d2540; }
    img { display: block; width: 100%; height: auto; }
    ol { position: absolute; inset: 0; display: grid; grid-template-rows: repeat(3, 1fr); margin: 0; padding: 0; list-style: none; }
    li { display: flex; align-items: flex-end; min-height: 0; }
    li + li { border-top: 1px solid #ffe3ba92; }
    h2 { width: 100%; color: #fff5e2; background: #211127ed; font: bold clamp(1rem, 4.8vw, 1.7rem) Georgia, serif; line-height: 1.15; margin: 0; padding: .6em .75em; text-align: center; }
  </style>
</head>
<body>
  <main>
    <a href="index.html">Volver a la ruleta</a>
    <h1>Menú</h1>
    <section class="carta" aria-label="Postres del puesto">
      <img src="menu-postres.webp" width="900" height="1350" alt="">
      <ol>
        <li><h2>Negra maluca</h2></li>
        <li><h2>Tarta de gelatina de uva</h2></li>
        <li><h2>Galletitas con chispa de chocolate</h2></li>
      </ol>
    </section>
  </main>
</body>
</html>
