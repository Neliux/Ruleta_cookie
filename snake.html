<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gato Viborita · Mystery Sweet Casino</title>
  <link rel="stylesheet" href="snake.css">
</head>
<body>
  <main>
    <nav aria-label="Volver"><a href="./">← Ruleta</a><a href="menu.html">Menú</a></nav>
    <h1>Gato Viborita</h1>
    <p class="puntos">🍪 <output id="puntos" aria-label="Galletitas recogidas">0</output> / 80</p>
    <div class="marco">
      <div id="tablero" aria-hidden="true"></div>
      <section id="ficha" aria-labelledby="mensaje">
        <h2 id="mensaje">¡A juntar galletitas!</h2>
        <button type="button" id="jugar">Jugar</button>
      </section>
    </div>
    <div class="mandos" aria-label="Controles de dirección">
      <button type="button" data-dir="up" aria-label="Arriba">↑</button>
      <button type="button" data-dir="left" aria-label="Izquierda">←</button>
      <button type="button" data-dir="down" aria-label="Abajo">↓</button>
      <button type="button" data-dir="right" aria-label="Derecha">→</button>
    </div>
    <p>Deslizá o usá las flechas. Esquivá las bombas 💣</p>
  </main>
  <script src="snake.js" defer></script>
</body>
</html>
